<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6750A4">
<title>编辑 - {{NAME}}</title>
<style>
:root{--primary:#6750A4;--primary-hover:#7c67b8;--bg:#F7F2FA;--surface:#FFFFFF;
--text:#1C1B1F;--border:#E7E0EC;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
--hl-k:#7C4DFF;--hl-s:#2E7D32;--hl-c:#9E9E9E;--hl-n:#1976D2;
--hl-t:#1565C0;--hl-a:#7C4DFF;--hl-at:#AD1457;--hl-h:#00897B;}
@media (prefers-color-scheme: dark){
  :root{--bg:#1C1B1F;--surface:#2B2930;--text:#E6E1E5;--border:#49454F;
  --hl-k:#B39DDB;--hl-s:#81C784;--hl-c:#757575;--hl-n:#64B5F6;
  --hl-t:#64B5F6;--hl-a:#B39DDB;--hl-at:#F48FB1;--hl-h:#4DB6AC;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
.app{max-width:900px;margin:0 auto;padding:0 16px 80px;}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
gap:12px;padding:14px 0;background:var(--bg);border-bottom:1px solid var(--border);margin-bottom:12px;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.back{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
border-radius:50%;background:var(--surface);color:var(--text);text-decoration:none;
box-shadow:var(--shadow);cursor:pointer;border:none;padding:0;}
.back svg{width:22px;height:22px;display:block;}
.title{flex:1;min-width:0;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;
border:1px solid var(--border);background:var(--surface);color:var(--text);
font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .15s ease;}
.btn:hover{box-shadow:0 4px 12px rgba(0,0,0,.15);}
.btn svg{width:16px;height:16px;display:block;}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn.primary:hover{background:var(--primary-hover);}

.editor{margin-top:8px;}
.editor-wrap{position:relative;height:70vh;min-height:400px;
border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;}
.editor-input,.editor-highlight{
  margin:0;border:0;padding:16px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;
  white-space:pre;word-wrap:normal;
  tab-size:4;-moz-tab-size:4;-o-tab-size:4;
}
.editor-input{
  position:absolute;inset:0;z-index:2;
  width:100%;height:100%;
  background:transparent;
  color:transparent;
  caret-color:var(--text);
  outline:none;resize:none;
  overflow:auto;
}
.editor-input::selection{background:rgba(103,80,164,.35);}
.editor-highlight{
  position:absolute;inset:0;z-index:1;
  width:100%;height:100%;
  color:var(--text);
  overflow:hidden;
  pointer-events:none;
}
.editor-highlight code{display:block;font:inherit;color:inherit;}

.editor-bar{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}

.hl-k{color:var(--hl-k);font-weight:500;}
.hl-s{color:var(--hl-s);}
.hl-c{color:var(--hl-c);font-style:italic;}
.hl-n{color:var(--hl-n);}
.hl-t{color:var(--hl-t);font-weight:500;}
.hl-a{color:var(--hl-a);}
.hl-at{color:var(--hl-at);}
.hl-h{color:var(--hl-h);font-weight:500;}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <button class="back" id="backBtn" type="button" title="返回">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="title">{{NAME}}</span>
  </div>
</header>
<form class="editor" method="post" action="{{SAVE_URL}}" id="editorForm">
  <div class="editor-wrap">
    <pre class="editor-highlight" id="hlPre" aria-hidden="true"><code id="hlCode"></code></pre>
    <textarea class="editor-input" id="editorInput" name="content" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">{{CONTENT}}</textarea>
  </div>
  <div class="editor-bar">
    <button class="btn" id="cancelBtn" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      取消
    </button>
    <button class="btn primary" type="submit">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
      保存
    </button>
  </div>
</form>
</div>
<script>
(function(){
  var LANG = "{{LANG}}";
  if (!LANG || LANG.indexOf('{{') >= 0) LANG = 'plain';

  var ta = document.getElementById('editorInput');
  var pre = document.getElementById('hlPre');
  var codeEl = document.getElementById('hlCode');

  function escHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ============ 高亮引擎 ============
  // 用 \x01 + N个\x02 + \x03 表示第 N-1 个 token，避免与后续正则冲突
  var _tokens = [];
  function _mark(type, content){
    var idx = _tokens.length;
    _tokens.push({t: type, c: content});
    var marks = '';
    for (var i = 0; i <= idx; i++) marks += '\x02';
    return '\x01' + marks + '\x03';
  }
  function _finish(s){
    return s.replace(/\x01(\x02*)\x03/g, function(m, marks){
      var idx = marks.length - 1;
      var tok = _tokens[idx];
      if (!tok) return m;
      return '<span class="hl-' + tok.t + '">' + tok.c + '</span>';
    });
  }

  // -------- XML / CHT --------
  function hlXml(src){
    var s = escHtml(src);

    // 1) 注释
    s = s.replace(/&lt;!--[\s\S]*?--&gt;/g, function(m){ return _mark('c', m); });

    // 2) <code>...</code> 内的 hex 金手指值
    s = s.replace(/(&lt;code&gt;)([\s\S]*?)(&lt;\/code&gt;)/g, function(m, o, inner, c){
      var out = inner.replace(/([0-9A-Fa-f]{6,8})\s+([0-9A-Fa-f]{2,8})/g, function(_, a, b){
        return _mark('h', a) + ' ' + _mark('h', b);
      });
      return o + out + c;
    });

    // 3) 标签名
    s = s.replace(/(&lt;\/?)([\w:.-]+)/g, function(m, open, name){
      return open + _mark('t', name);
    });

    // 4) 属性名
    s = s.replace(/([\w:.-]+)=/g, function(m, name){
      return _mark('a', name) + '=';
    });

    // 5) 属性值
    s = s.replace(/=("[^"\n]*"|'[^'\n]*')/g, function(m, val){
      return '=' + _mark('s', val);
    });

    // 6) 剩余数字
    s = s.replace(/\b(\d+)\b/g, function(m, d){ return _mark('n', d); });

    return s;
  }

  // -------- Java / Kotlin / JS / Python / Shell / C --------
  var JAVA_KW_RE = /\b(abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|true|false|null|var|let|function|typeof|undefined|in|of|def|elif|lambda|from|as|with|yield|await|async|echo|then|fi|esac|do|done)\b/g;

  function hlJava(src){
    var s = escHtml(src);
    // 块注释
    s = s.replace(/\/\*[\s\S]*?\*\//g, function(m){ return _mark('c', m); });
    // 行注释
    s = s.replace(/\/\/[^\n]*/g, function(m){ return _mark('c', m); });
    s = s.replace(/#[^\n]*/g, function(m){
      // 避免误吃 # 攻击 之类（XML 里不会走这里，但保险）
      return _mark('c', m);
    });
    // 双引号字符串（支持转义）
    s = s.replace(/"(?:\\.|[^"\\\n])*"/g, function(m){ return _mark('s', m); });
    // 单引号字符
    s = s.replace(/'(?:\\.|[^'\\\n])*'/g, function(m){ return _mark('s', m); });
    // 注解
    s = s.replace(/@[\w.]+/g, function(m){ return _mark('at', m); });
    // 关键字
    s = s.replace(JAVA_KW_RE, function(m){ return _mark('k', m); });
    // 数字
    s = s.replace(/\b(0x[0-9a-fA-F]+|\d+(\.\d+)?[fFdDlL]?)\b/g, function(m){ return _mark('n', m); });
    return s;
  }

  // -------- JSON --------
  function hlJson(src){
    var s = escHtml(src);
    s = s.replace(/"(?:\\.|[^"\\\n])*"/g, function(m){ return _mark('s', m); });
    s = s.replace(/\b(true|false|null)\b/g, function(m){ return _mark('k', m); });
    s = s.replace(/\b-?\d+(\.\d+)?([eE][+-]?\d+)?\b/g, function(m){ return _mark('n', m); });
    return s;
  }

  function highlight(src, lang){
    _tokens = [];
    try {
      if (lang === 'xml') return _finish(hlXml(src));
      if (lang === 'java') return _finish(hlJava(src));
      if (lang === 'json') return _finish(hlJson(src));
    } catch (e) {
      if (window.console) console.warn('highlight error', e);
    }
    return escHtml(src);
  }

  // ============ 渲染 & 同步 ============
  var renderTimer = null;
  function render(){
    renderTimer = null;
    codeEl.innerHTML = highlight(ta.value, LANG) + '\n';
    pre.scrollTop = ta.scrollTop;
    pre.scrollLeft = ta.scrollLeft;
  }
  function scheduleRender(){
    if (renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 30);
  }

  ta.addEventListener('input', scheduleRender);
  ta.addEventListener('scroll', function(){
    pre.scrollTop = ta.scrollTop;
    pre.scrollLeft = ta.scrollLeft;
  });

  // Tab 键插入 4 空格
  ta.addEventListener('keydown', function(e){
    if (e.key === 'Tab' || e.keyCode === 9) {
      e.preventDefault();
      var start = ta.selectionStart, end = ta.selectionEnd;
      var v = ta.value;
      ta.value = v.slice(0, start) + '    ' + v.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 4;
      render();
    }
  });

  render();

  // ============ 返回 / 保存 ============
  function goBack(){
    var ref = document.referrer || '';
    var origin = location.origin || (location.protocol + '//' + location.host);
    if (ref.indexOf(origin) === 0) {
      history.back();
    } else {
      location.replace('/?p={{PARENT}}');
    }
  }
  document.getElementById('backBtn').addEventListener('click', goBack);
  document.getElementById('cancelBtn').addEventListener('click', goBack);

  document.getElementById('editorForm').addEventListener('submit', function(e){
    e.preventDefault();
    var content = ta.value;
    var body = 'content=' + encodeURIComponent(content);
    fetch(this.getAttribute('action'), {
      method:'POST',
      cache:'no-store',
      headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},
      body: body
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ alert('保存失败：'+t); });
      goBack();
    }).catch(function(err){ alert('保存失败：'+err); });
  });
})();
</script>
</body>
</html>
